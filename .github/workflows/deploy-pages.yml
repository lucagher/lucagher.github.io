name: Deploy to GitHub Pages

on:
  push:
    branches: ["tip"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate credential hashes (from GitHub Secrets)
        run: node tools/generate-credential-hashes.mjs
        env:
          TEAM1_PASSWORD: ${{ secrets.TEAM1_PASSWORD }}
          TEAM2_PASSWORD: ${{ secrets.TEAM2_PASSWORD }}
          TEAM3_PASSWORD: ${{ secrets.TEAM3_PASSWORD }}
          TEAM4_PASSWORD: ${{ secrets.TEAM4_PASSWORD }}
          TEAM5_PASSWORD: ${{ secrets.TEAM5_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



