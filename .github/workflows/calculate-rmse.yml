name: Calculate RMSE for Submissions

on:
  repository_dispatch:
    types: [calculate-rmse]
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Team ID'
        required: true
        type: string
      predictions_json:
        description: 'Predictions as JSON array'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  calculate-rmse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ACTUAL_VALUES }}" ]; then
            echo "::error::ACTUAL_VALUES secret is not set. Please configure it in GitHub Secrets (Settings -> Secrets and variables -> Actions)."
            echo "The secret should be a comma-separated list of numbers, e.g., '1.0,2.5,3.7,4.2'"
            exit 1
          fi
          echo "✓ ACTUAL_VALUES secret is configured"

      - name: Parse inputs
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEAM_ID="${{ github.event.inputs.team_id }}"
            PREDICTIONS='${{ github.event.inputs.predictions_json }}'
          else
            TEAM_ID="${{ github.event.client_payload.team_id }}"
            PREDICTIONS='${{ github.event.client_payload.predictions_json }}'
          fi

          # Base64-encode predictions to avoid quoting / newline issues when passing via outputs
          PREDICTIONS_B64=$(printf '%s' "$PREDICTIONS" | base64 | tr -d '\n')

          echo "team_id=${TEAM_ID}" >> $GITHUB_OUTPUT
          echo "predictions_b64=${PREDICTIONS_B64}" >> $GITHUB_OUTPUT

      - name: Calculate RMSE
        id: rmse
        run: |
          # Load actual values (secret) and decode predictions
          ACTUAL_VALUES="${{ secrets.ACTUAL_VALUES }}"
          PREDICTIONS_B64="${{ steps.parse.outputs.predictions_b64 }}"

          if [ -z "$PREDICTIONS_B64" ]; then
            echo "Error: predictions missing from inputs" >&2
            exit 1
          fi

          # decode predictions safely
          export PREDICTIONS=$(echo "$PREDICTIONS_B64" | base64 --decode 2>/dev/null) || {
            echo "Error: failed to decode predictions_b64" >&2
            exit 1
          }

          # Debug info (do not print secrets)
          echo "Actual values count: $(echo "$ACTUAL_VALUES" | tr ',' '\n' | grep -c .)"
          
          # Run Python to compute RMSE; it will print only the numeric RMSE to stdout
          RMSE=$(python3 - <<'PY'
          import json, math, os, sys
          
          actual_str = os.environ.get('ACTUAL_VALUES', '').strip()
          if not actual_str:
              print("Error: ACTUAL_VALUES secret is empty or not set", file=sys.stderr)
              sys.exit(1)
          
          # parse actual
          actual = []
          try:
              for x in actual_str.split(','):
                  x_clean = x.strip()
                  if x_clean:
                      actual.append(float(x_clean))
          except Exception as e:
              print(f"Error parsing ACTUAL_VALUES: {e}", file=sys.stderr)
              sys.exit(1)
          
          if len(actual) == 0:
              print("Error: No valid actual values found", file=sys.stderr)
              sys.exit(1)
          
          predictions_str = os.environ.get('PREDICTIONS', '').strip()
          if not predictions_str:
              print("Error: PREDICTIONS is empty", file=sys.stderr)
              sys.exit(1)
          
          try:
              predictions = json.loads(predictions_str)
          except json.JSONDecodeError as e:
              print(f"Error: Invalid JSON in PREDICTIONS: {e}", file=sys.stderr)
              sys.exit(1)
          
          if not isinstance(predictions, list):
              print(f"Error: Predictions must be a list, got {type(predictions)}", file=sys.stderr)
              sys.exit(1)
          
          if len(predictions) == 0:
              print("Error: Predictions list is empty", file=sys.stderr)
              sys.exit(1)
          
          try:
              predictions = [float(p) for p in predictions]
          except Exception as e:
              print(f"Error converting predictions to floats: {e}", file=sys.stderr)
              sys.exit(1)
          
          if len(predictions) != len(actual):
              print(f"Error: length mismatch predictions({len(predictions)}) vs actual({len(actual)})", file=sys.stderr)
              sys.exit(1)
          
          try:
              mse = sum((a - p) ** 2 for a, p in zip(actual, predictions)) / len(actual)
              rmse = math.sqrt(mse)
          except Exception as e:
              print(f"Error calculating RMSE: {e}", file=sys.stderr)
              sys.exit(1)
          
          # Print only the numeric RMSE to stdout (6 decimal places)
          print(f"{rmse:.6f}")
          PY
          )
          
          # Validate RMSE captured
          if [ -z "$RMSE" ]; then
            echo "Error: RMSE computation produced no output" >&2
            exit 1
          fi
          
          # Write step output
          echo "rmse=$RMSE" >> $GITHUB_OUTPUT
        env:
          ACTUAL_VALUES: ${{ secrets.ACTUAL_VALUES }}

      - name: Update leaderboard data
        run: |
          TEAM_ID='${{ steps.parse.outputs.team_id }}'
          RMSE='${{ steps.rmse.outputs.rmse }}'

          if [ -z "$RMSE" ]; then
            echo "Error: RMSE value is empty"
            exit 1
          fi

          echo "Updating leaderboard for team: $TEAM_ID with RMSE: $RMSE"

          mkdir -p Datachallenge/assets

          if [ -f "Datachallenge/assets/leaderboard-data.json" ]; then
            python3 <<'PY'
          import json, os
          from datetime import datetime
          team_id = os.environ.get('TEAM_ID')
          rmse = float(os.environ.get('RMSE'))
          try:
              with open('Datachallenge/assets/leaderboard-data.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          if team_id not in data:
              data[team_id] = {'score': None, 'entries': 0, 'lastSubmission': None}
          data[team_id]['score'] = rmse
          data[team_id]['entries'] = data[team_id].get('entries', 0) + 1
          data[team_id]['lastSubmission'] = datetime.now().isoformat()
          with open('Datachallenge/assets/leaderboard-data.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f"Updated {team_id} with RMSE: {rmse}")
          PY
          else
            python3 <<'PY'
          import json, os
          from datetime import datetime
          team_id = os.environ.get('TEAM_ID')
          rmse = float(os.environ.get('RMSE'))
          data = {
              team_id: {
                  'score': rmse,
                  'entries': 1,
                  'lastSubmission': datetime.now().isoformat()
              }
          }
          with open('Datachallenge/assets/leaderboard-data.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f"Created new entry for {team_id} with RMSE: {rmse}")
          PY
          fi
        env:
          TEAM_ID: ${{ steps.parse.outputs.team_id }}
          RMSE: ${{ steps.rmse.outputs.rmse }}

      - name: Commit and push leaderboard update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Datachallenge/assets/leaderboard-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update leaderboard: ${{ steps.parse.outputs.team_id }} - RMSE: ${{ steps.rmse.outputs.rmse }}"
            git push
            echo "✓ Leaderboard updated and pushed"
          else
            echo "No changes to commit"
          fi
