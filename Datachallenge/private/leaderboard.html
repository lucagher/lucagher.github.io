<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .title-section {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--aau-blue);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .table-header {
      background: var(--aau-blue);
      color: white;
    }
    
    .table-row:hover {
      background: #f8fafc;
    }
    
    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      .title-main {
        font-size: 2rem;
        line-height: 1.2;
      }
      
      .card {
        margin: 0 1rem;
        padding: 1.25rem;
      }
      
      .btn-nav {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }
      
      .table-header th {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
      
      .table-row td {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
    }
    
    @media (max-width: 480px) {
      .title-main {
        font-size: 1.75rem;
      }
      
      .card {
        margin: 0 0.5rem;
        padding: 1rem;
      }
      
      .btn-nav {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-row td {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      #leaderboardTable {
        min-width: 400px;
      }
    }
  </style>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800">
  <!-- Logo and Title -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div class="flex flex-col lg:flex-row items-center lg:items-start justify-between">
      <!-- Title Section -->
      <div class="text-center lg:text-left mb-6 lg:mb-0 flex-1">
        <h1 class="title-main text-2xl sm:text-3xl lg:text-4xl mb-4 font-bold" style="color: var(--aau-blue); font-family: 'Lato', sans-serif;">Competition Dashboard</h1>
        
        <!-- Back to Home Button -->
        <div class="mt-4 sm:mt-6">
          <a href="../index.html" class="inline-flex items-center px-4 sm:px-6 py-2.5 sm:py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 hover:text-[var(--aau-blue)] rounded-lg transition-all duration-300 font-medium text-sm sm:text-base" style="font-family: 'Inter', sans-serif;">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Home
          </a>
        </div>
      </div>
      
      <!-- Logo -->
      <div class="flex-shrink-0 lg:ml-8">
        <img src="../assets/logo2.png" alt="Universität Klagenfurt logo" class="h-16 sm:h-20 lg:h-24 opacity-90">
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex justify-center mb-8 sm:mb-12 px-4">
    <div class="bg-gray-100 p-1 rounded-lg w-full max-w-md">
      <div class="grid grid-cols-3 gap-1">
        <a href="overview.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Overview</a>
        <a href="dataset.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Dataset</a>
        <a href="leaderboard.html" class="btn-nav active px-2 sm:px-4 py-2 rounded-md text-center">Leaderboard</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 space-y-4 sm:space-y-6">
    <section class="card p-4 sm:p-6 lg:p-8">
      <h2 class="title-section text-xl sm:text-2xl mb-4 sm:mb-6">Submit Predictions</h2>
      <form id="uploadForm" class="space-y-4 sm:space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Upload CSV File</label>
          <input type="file" accept=".csv" class="w-full border border-gray-300 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent text-sm" required>
        </div>
        <button type="submit" class="btn-primary text-white px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg w-full sm:w-auto text-sm sm:text-base">Upload Predictions</button>
      </form>
    </section>

    <!-- Table -->
    <section class="card p-4 sm:p-6 lg:p-8">
      <h2 class="title-section text-xl sm:text-2xl mb-4 sm:mb-6">Leaderboard</h2>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[500px]" id="leaderboardTable">
          <thead>
            <tr class="table-header">
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Rank</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Team</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Score</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Entries</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Last</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200" id="leaderboardBody">
            <!-- Data will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Team Selection Modal -->
  <div id="teamSelectionModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
      <div class="mt-3">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">Select Your Team</h3>
          <button id="closeModal" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Choose your team:</label>
          <select id="teamSelect" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent">
            <option value="">Select a team...</option>
          </select>
        </div>
        
        <div id="newTeamInput" class="mb-4 hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Enter new team name:</label>
          <input type="text" id="newTeamName" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent" placeholder="Team name...">
        </div>
        
        <div class="flex justify-end space-x-3">
          <button id="cancelTeam" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors">
            Cancel
          </button>
          <button id="confirmTeam" class="px-4 py-2 bg-[var(--aau-blue)] text-white rounded-lg hover:bg-[var(--aau-light-blue)] transition-colors">
            Submit
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample leaderboard data - in a real app, this would come from a server
    const leaderboardData = [
      { team: "Team Alpha", score: 0.123, entries: 15, lastSubmission: "2 hours ago" },
      { team: "Data Ninjas", score: 0.145, entries: 12, lastSubmission: "4 hours ago" },
      { team: "ML Masters", score: 0.156, entries: 8, lastSubmission: "1 day ago" },
      { team: "AI Warriors", score: 0.167, entries: 20, lastSubmission: "30 min ago" },
      { team: "Code Breakers", score: 0.178, entries: 6, lastSubmission: "3 days ago" },
      { team: "Data Scientists", score: 0.189, entries: 14, lastSubmission: "6 hours ago" },
      { team: "Algorithm Experts", score: 0.201, entries: 9, lastSubmission: "1 day ago" },
      { team: "Prediction Pros", score: 0.212, entries: 11, lastSubmission: "2 hours ago" }
    ];

    // Available teams for selection
    const availableTeams = [
      "Team Alpha", "Data Ninjas", "ML Masters", "AI Warriors", 
      "Code Breakers", "Data Scientists", "Algorithm Experts", 
      "Prediction Pros", "New Team"
    ];

    // Store uploaded file temporarily
    let uploadedFile = null;

    // Function to sort data by score (ascending - lower is better)
    function sortLeaderboard(data) {
      return data.sort((a, b) => a.score - b.score);
    }

    // Function to format score
    function formatScore(score) {
      return score.toFixed(3);
    }

    // Function to format last submission time
    function formatLastSubmission(time) {
      return time;
    }

    // Function to render leaderboard
    function renderLeaderboard() {
      const sortedData = sortLeaderboard([...leaderboardData]);
      const tbody = document.getElementById('leaderboardBody');
      
      tbody.innerHTML = sortedData.map((entry, index) => `
        <tr class="table-row">
          <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-base sm:text-lg font-semibold text-[var(--aau-blue)]">${index + 1}</td>
          <td class="px-3 sm:px-6 py-3 sm:py-4 font-medium">${entry.team}</td>
          <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono">${formatScore(entry.score)}</td>
          <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-sm">${entry.entries}</td>
          <td class="px-3 sm:px-6 py-3 sm:py-4 text-sm text-gray-600">${formatLastSubmission(entry.lastSubmission)}</td>
        </tr>
      `).join('');
    }

    // Function to populate team select dropdown
    function populateTeamSelect() {
      const teamSelect = document.getElementById('teamSelect');
      teamSelect.innerHTML = '<option value="">Select a team...</option>';
      
      availableTeams.forEach(team => {
        const option = document.createElement('option');
        option.value = team;
        option.textContent = team;
        teamSelect.appendChild(option);
      });
    }

    // Function to show team selection modal
    function showTeamSelectionModal(file) {
      uploadedFile = file;
      const modal = document.getElementById('teamSelectionModal');
      modal.classList.remove('hidden');
      populateTeamSelect();
    }

    // Function to hide team selection modal
    function hideTeamSelectionModal() {
      const modal = document.getElementById('teamSelectionModal');
      modal.classList.add('hidden');
      uploadedFile = null;
      
      // Reset form
      document.getElementById('teamSelect').value = '';
      document.getElementById('newTeamName').value = '';
      document.getElementById('newTeamInput').classList.add('hidden');
    }

    // Function to handle team selection change
    function handleTeamSelectionChange() {
      const teamSelect = document.getElementById('teamSelect');
      const newTeamInput = document.getElementById('newTeamInput');
      
      if (teamSelect.value === 'New Team') {
        newTeamInput.classList.remove('hidden');
        document.getElementById('newTeamName').required = true;
      } else {
        newTeamInput.classList.add('hidden');
        document.getElementById('newTeamName').required = false;
      }
    }

    // Function to handle team confirmation
    function handleTeamConfirmation() {
      const teamSelect = document.getElementById('teamSelect');
      const newTeamName = document.getElementById('newTeamName');
      
      let selectedTeam = teamSelect.value;
      
      if (selectedTeam === 'New Team') {
        selectedTeam = newTeamName.value.trim();
        if (!selectedTeam) {
          alert('Please enter a team name');
          return;
        }
      }
      
      if (!selectedTeam) {
        alert('Please select a team');
        return;
      }
      
      // Simulate adding a new entry with the selected team
      const newEntry = {
        team: selectedTeam,
        score: Math.random() * 0.1 + 0.1, // Simulate random score
        entries: 1,
        lastSubmission: "Just now"
      };
      
      // Check if team already exists
      const existingTeamIndex = leaderboardData.findIndex(entry => entry.team === selectedTeam);
      
      if (existingTeamIndex !== -1) {
        // Update existing team's score and entries
        leaderboardData[existingTeamIndex].score = newEntry.score;
        leaderboardData[existingTeamIndex].entries += 1;
        leaderboardData[existingTeamIndex].lastSubmission = newEntry.lastSubmission;
      } else {
        // Add new team
        leaderboardData.push(newEntry);
      }
      
      renderLeaderboard();
      hideTeamSelectionModal();
      
      // Show success message
      alert(`Prediction submitted successfully for ${selectedTeam}!`);
    }

    // Function to handle form submission
    function handleFormSubmit(event) {
      event.preventDefault();
      
      const fileInput = event.target.querySelector('input[type="file"]');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Please select a file to upload');
        return;
      }
      
      // Validate file type
      if (!file.name.toLowerCase().endsWith('.csv')) {
        alert('Please upload a CSV file');
        return;
      }
      
      // Show team selection modal
      showTeamSelectionModal(file);
    }

    // Initialize leaderboard when page loads
    document.addEventListener('DOMContentLoaded', function() {
      renderLeaderboard();
      
      // Add form submit handler
      const form = document.getElementById('uploadForm');
      if (form) {
        form.addEventListener('submit', handleFormSubmit);
      }
      
      // Add modal event listeners
      const modal = document.getElementById('teamSelectionModal');
      const closeModal = document.getElementById('closeModal');
      const cancelTeam = document.getElementById('cancelTeam');
      const confirmTeam = document.getElementById('confirmTeam');
      const teamSelect = document.getElementById('teamSelect');
      
      // Close modal handlers
      closeModal.addEventListener('click', hideTeamSelectionModal);
      cancelTeam.addEventListener('click', hideTeamSelectionModal);
      
      // Confirm team selection
      confirmTeam.addEventListener('click', handleTeamConfirmation);
      
      // Handle team selection change
      teamSelect.addEventListener('change', handleTeamSelectionChange);
      
      // Close modal when clicking outside
      modal.addEventListener('click', function(event) {
        if (event.target === modal) {
          hideTeamSelectionModal();
        }
      });
    });

    // Auto-refresh leaderboard every 30 seconds (optional)
    setInterval(renderLeaderboard, 30000);
  </script>
</body>
</html>
