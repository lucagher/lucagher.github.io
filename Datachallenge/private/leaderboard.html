<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .title-section {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--aau-blue);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .table-header {
      background: var(--aau-blue);
      color: white;
    }
    
    .table-row:hover {
      background: #f8fafc;
    }
    
    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      .title-main {
        font-size: 2rem;
        line-height: 1.2;
      }
      
      .card {
        margin: 0 1rem;
        padding: 1.25rem;
      }
      
      .btn-nav {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }
      
      .table-header th {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
      
      .table-row td {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
    }
    
    @media (max-width: 480px) {
      .title-main {
        font-size: 1.75rem;
      }
      
      .card {
        margin: 0 0.5rem;
        padding: 1rem;
      }
      
      .btn-nav {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-row td {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      #leaderboardTable {
        min-width: 400px;
      }
    }
  </style>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800">
  <!-- Logo and Title -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div class="flex flex-col lg:flex-row items-center lg:items-start justify-between">
      <!-- Title Section -->
      <div class="text-center lg:text-left mb-6 lg:mb-0 flex-1">
        <h1 class="title-main text-2xl sm:text-3xl lg:text-4xl mb-4 font-bold" style="color: var(--aau-blue); font-family: 'Lato', sans-serif;">Competition Dashboard</h1>
        
        <!-- Back to Home Button -->
        <div class="mt-4 sm:mt-6 flex flex-col gap-3">
          <div class="flex gap-3">
            <a href="../index.html" class="inline-flex items-center px-4 sm:px-6 py-2.5 sm:py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 hover:text-[var(--aau-blue)] rounded-lg transition-all duration-300 font-medium text-sm sm:text-base" style="font-family: 'Inter', sans-serif;">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
              </svg>
              Back to Home
            </a>
            <button onclick="logout()" class="inline-flex items-center px-4 sm:px-6 py-2.5 sm:py-3 bg-red-100 hover:bg-red-200 text-red-700 hover:text-red-900 rounded-lg transition-all duration-300 font-medium text-sm sm:text-base" style="font-family: 'Inter', sans-serif;">
              Logout
            </button>
          </div>
          <!-- User Info with Logo -->
          <div id="userInfo" class="flex items-center gap-2 mt-2" style="display: none;">
            <img id="userLogo" src="" alt="Team Logo" class="w-8 h-8 rounded-full object-cover border-2 border-[var(--aau-blue)]" style="display: none;">
            <span id="userName" class="text-sm font-medium text-gray-700"></span>
            <button onclick="changeTeamLogo()" class="ml-2 text-xs text-[var(--aau-blue)] hover:underline">Change Logo</button>
          </div>
        </div>
      </div>
      
      <!-- Logo -->
      <div class="flex-shrink-0 lg:ml-8">
        <img src="../assets/logo2.png" alt="Universität Klagenfurt logo" class="h-16 sm:h-20 lg:h-24 opacity-90">
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex justify-center mb-8 sm:mb-12 px-4">
    <div class="bg-gray-100 p-1 rounded-lg w-full max-w-md">
      <div class="grid grid-cols-3 gap-1">
        <a href="overview.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Overview</a>
        <a href="dataset.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Dataset</a>
        <a href="leaderboard.html" class="btn-nav active px-2 sm:px-4 py-2 rounded-md text-center">Leaderboard</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 space-y-4 sm:space-y-6">
    <section class="card p-4 sm:p-6 lg:p-8">
      <h2 class="title-section text-xl sm:text-2xl mb-4 sm:mb-6">Submit Predictions</h2>
      
      <form id="uploadForm" class="space-y-4 sm:space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Upload CSV File</label>
          <input type="file" accept=".csv" class="w-full border border-gray-300 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent text-sm" required>
        </div>
        <button type="submit" class="btn-primary text-white px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg w-full sm:w-auto text-sm sm:text-base">Upload Predictions</button>
      </form>
    </section>

    <!-- Table -->
    <section class="card p-4 sm:p-6 lg:p-8">
      <div class="flex justify-between items-center mb-4 sm:mb-6">
        <h2 class="title-section text-xl sm:text-2xl">Leaderboard</h2>
        <div id="adminControls" style="display: none;">
          <button onclick="resetLeaderboard()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow transition-colors text-sm font-medium">
            🔄 Reset Scores
          </button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[500px]" id="leaderboardTable">
          <thead>
            <tr class="table-header">
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Rank</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Team</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Score</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Entries</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Last</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200" id="leaderboardBody">
            <!-- Data will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Team name mapping
    const teamNames = {
      'aau26_team1': 'P-value pirates',
      'aau26_team2': 'The Rvengers',
      'aau26_team3': 'Outliers',
      'aau26_team4': 'Smooth operators',
      'aau26_team5': 'Byte me'
    };

    // Initialize leaderboard data from localStorage or use default data
    function initializeLeaderboard() {
      const storedData = localStorage.getItem('leaderboardData');
      let data = [];
      
      if (storedData) {
        data = JSON.parse(storedData);
        // Update team names if they're outdated
        data.forEach(entry => {
          if (teamNames[entry.teamId]) {
            entry.team = teamNames[entry.teamId];
          }
        });
      } else {
        // Default empty leaderboard for the 5 teams
        data = [
          { teamId: 'aau26_team1', team: 'P-value pirates', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team2', team: 'The Rvengers', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team3', team: 'Outliers', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team4', team: 'Smooth operators', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team5', team: 'Byte me', score: null, entries: 0, lastSubmission: 'No submissions yet' }
        ];
      }
      
      // Ensure all 5 teams are present
      const existingTeamIds = new Set(data.map(e => e.teamId));
      Object.keys(teamNames).forEach(teamId => {
        if (!existingTeamIds.has(teamId)) {
          data.push({
            teamId: teamId,
            team: teamNames[teamId],
            score: null,
            entries: 0,
            lastSubmission: 'No submissions yet'
          });
        }
      });
      
      return data;
    }
    
    let leaderboardData = initializeLeaderboard();

    // Function to sort data by score (ascending - lower is better)
    function sortLeaderboard(data) {
      return data.sort((a, b) => {
        // Teams without scores go to the bottom
        if (a.score === null && b.score === null) return 0;
        if (a.score === null) return 1;
        if (b.score === null) return -1;
        return a.score - b.score;
      });
    }

    // Function to format score
    function formatScore(score) {
      if (score === null) return '-';
      return score.toFixed(3);
    }
    
    // Function to save leaderboard data to localStorage
    function saveLeaderboardData() {
      localStorage.setItem('leaderboardData', JSON.stringify(leaderboardData));
    }

    // Function to format last submission time
    function formatLastSubmission(time) {
      return time;
    }

    // Function to get team logo
    function getTeamLogo(teamId) {
      const logos = JSON.parse(localStorage.getItem('teamLogos') || '{}');
      return logos[teamId] || null;
    }

    // Function to save team logo
    function saveTeamLogo(teamId, logoData) {
      const logos = JSON.parse(localStorage.getItem('teamLogos') || '{}');
      logos[teamId] = logoData;
      localStorage.setItem('teamLogos', JSON.stringify(logos));
    }

    // Function to change team logo
    function changeTeamLogo() {
      const currentTeamId = sessionStorage.getItem('teamId');
      if (!currentTeamId) {
        alert('Please log in to change your team logo!');
        return;
      }

      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          alert('Image size must be less than 2MB');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const logoData = e.target.result;
          saveTeamLogo(currentTeamId, logoData);
          updateUserInfo();
          renderLeaderboard();
          alert('Logo updated successfully!');
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // Function to update user info display
    function updateUserInfo() {
      const currentTeamId = sessionStorage.getItem('teamId');
      const currentTeamName = sessionStorage.getItem('teamName');
      const userInfo = document.getElementById('userInfo');
      const userName = document.getElementById('userName');
      const userLogo = document.getElementById('userLogo');

      if (currentTeamId && currentTeamName) {
        userInfo.style.display = 'flex';
        userName.textContent = currentTeamName;
        
        const logo = getTeamLogo(currentTeamId);
        if (logo) {
          userLogo.src = logo;
          userLogo.style.display = 'block';
        } else {
          userLogo.style.display = 'none';
        }
      } else {
        userInfo.style.display = 'none';
      }
    }

    // Function to render leaderboard
    function renderLeaderboard() {
      const sortedData = sortLeaderboard([...leaderboardData]);
      const tbody = document.getElementById('leaderboardBody');
      const currentTeamId = sessionStorage.getItem('teamId');
      
      tbody.innerHTML = sortedData.map((entry, index) => {
        const isCurrentTeam = entry.teamId === currentTeamId;
        const rowClass = isCurrentTeam ? 'table-row bg-blue-50 font-semibold' : 'table-row';
        const teamCellClass = isCurrentTeam ? 'px-3 sm:px-6 py-3 sm:py-4 font-medium text-[var(--aau-blue)]' : 'px-3 sm:px-6 py-3 sm:py-4 font-medium';
        
        const teamLogo = getTeamLogo(entry.teamId);
        const logoHtml = teamLogo 
          ? `<img src="${teamLogo}" alt="${entry.team} logo" class="w-6 h-6 rounded-full object-cover inline-block mr-2 border border-gray-300">`
          : `<div class="w-6 h-6 rounded-full bg-gray-200 inline-block mr-2 flex items-center justify-center text-xs text-gray-500">${entry.team.charAt(0)}</div>`;
        
        return `
          <tr class="${rowClass}">
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-base sm:text-lg font-semibold text-[var(--aau-blue)]">${index + 1}</td>
            <td class="${teamCellClass}">
              <div class="flex items-center">
                ${logoHtml}
                <span>${entry.team}${isCurrentTeam ? ' <span class="text-xs">(You)</span>' : ''}</span>
              </div>
            </td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono">${formatScore(entry.score)}</td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-sm">${entry.entries}</td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 text-sm text-gray-600">${formatLastSubmission(entry.lastSubmission)}</td>
          </tr>
        `;
      }).join('');
    }

    // Function to calculate RMSE
    function calculateRMSE(actual, predictions) {
      if (actual.length !== predictions.length) {
        throw new Error('Actual and prediction arrays must have the same length');
      }
      
      let sumSquaredErrors = 0;
      for (let i = 0; i < actual.length; i++) {
        const error = actual[i] - predictions[i];
        sumSquaredErrors += error * error;
      }
      
      const meanSquaredError = sumSquaredErrors / actual.length;
      return Math.sqrt(meanSquaredError);
    }

    // Function to parse CSV content
    function parseCSV(csvContent) {
      const lines = csvContent.trim().split('\n');
      const values = [];
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line) {
          // Handle CSV with or without headers
          const value = parseFloat(line.split(',')[0]);
          if (!isNaN(value)) {
            values.push(value);
          }
        }
      }
      
      return values;
    }

    // Function to handle form submission
    function handleFormSubmit(event) {
      event.preventDefault();
      
      // Get the current logged-in team
      const currentTeamId = sessionStorage.getItem('teamId');
      
      if (!currentTeamId) {
        alert('Please log in to submit predictions!');
        return;
      }
      
      // Get the uploaded file
      const fileInput = document.querySelector('input[type="file"]');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Please select a CSV file to upload!');
        return;
      }
      
      if (!file.name.toLowerCase().endsWith('.csv')) {
        alert('Please upload a CSV file!');
        return;
      }
      
      // Read the file
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const csvContent = e.target.result;
          const predictions = parseCSV(csvContent);
          
          // Load actual values (in a real app, this would come from server)
          const actualValues = [0.3, 1, 3, -1]; // Your actual values
          
          if (predictions.length !== actualValues.length) {
            alert(`Error: Your predictions must have ${actualValues.length} values, but you provided ${predictions.length}.`);
            return;
          }
          
          // Calculate RMSE
          const rmse = calculateRMSE(actualValues, predictions);
          
          // Find the team in the leaderboard
          let teamEntry = leaderboardData.find(entry => entry.teamId === currentTeamId);
          
          if (!teamEntry) {
            // Create a new entry if team doesn't exist in leaderboard
            const teamName = sessionStorage.getItem('teamName') || 'Unknown Team';
            teamEntry = {
              teamId: currentTeamId,
              team: teamName,
              score: null,
              entries: 0,
              lastSubmission: 'No submissions yet'
            };
            leaderboardData.push(teamEntry);
          }
          
          // Update score with the latest submission (not the best)
          teamEntry.score = rmse;
          
          teamEntry.entries += 1;
          teamEntry.lastSubmission = "Just now";
          
          // Save to localStorage
          saveLeaderboardData();
          
          // Re-render leaderboard
          renderLeaderboard();
          
          // Show success message with RMSE
          alert(`Upload successful!\nLatest RMSE Score: ${rmse.toFixed(4)}`);
          
        } catch (error) {
          alert('Error processing CSV file: ' + error.message);
        }
      };
      
      reader.readAsText(file);
    }

    // Logout function
    function logout() {
      sessionStorage.removeItem('teamId');
      sessionStorage.removeItem('teamName');
      sessionStorage.removeItem('isAdmin');
      window.location.href = '../login.html?competition=renewable';
    }

    // Function to reset leaderboard (Admin only)
    function resetLeaderboard() {
      if (!confirm('Are you sure you want to reset the leaderboard? This action cannot be undone.')) {
        return;
      }
      
      localStorage.removeItem('leaderboardData');
      leaderboardData = initializeLeaderboard(); // Reloads default data
      saveLeaderboardData();
      renderLeaderboard();
      alert('Leaderboard has been reset.');
    }

    // Initialize leaderboard when page loads
    document.addEventListener('DOMContentLoaded', function() {
      // Update team names in existing data and save
      leaderboardData = initializeLeaderboard();
      saveLeaderboardData();
      
      // Update user info display
      updateUserInfo();
      
      renderLeaderboard();
      
      // Check for admin access and show reset button
      if (sessionStorage.getItem('isAdmin') === 'true') {
        const adminControls = document.getElementById('adminControls');
        if (adminControls) {
          adminControls.style.display = 'block';
        }
      }
      
      // Add form submit handler
      const form = document.getElementById('uploadForm');
      if (form) {
        form.addEventListener('submit', handleFormSubmit);
      }
    });

    // Auto-refresh leaderboard every 30 seconds (optional)
    setInterval(renderLeaderboard, 30000);
  </script>
</body>
</html>
