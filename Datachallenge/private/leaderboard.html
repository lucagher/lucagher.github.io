<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .title-section {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--aau-blue);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .table-header {
      background: var(--aau-blue);
      color: white;
    }
    
    .table-row:hover {
      background: #f8fafc;
    }
    
    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      .title-main {
        font-size: 2rem;
        line-height: 1.2;
      }
      
      .card {
        margin: 0 1rem;
        padding: 1.25rem;
      }
      
      .btn-nav {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }
      
      .table-header th {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
      
      .table-row td {
        padding: 0.75rem 0.5rem;
        font-size: 0.875rem;
      }
    }
    
    @media (max-width: 480px) {
      .title-main {
        font-size: 1.75rem;
      }
      
      .card {
        margin: 0 0.5rem;
        padding: 1rem;
      }
      
      .btn-nav {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-row td {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      .table-header th {
        padding: 0.5rem 0.25rem;
        font-size: 0.8rem;
      }
      
      #leaderboardTable {
        min-width: 400px;
      }
    }
  </style>
</head>

        <!-- Back to Home Button -->

  <!-- Navigation -->
  <nav class="flex justify-center mb-8 sm:mb-12 px-4">
    <div class="bg-gray-100 p-1 rounded-lg w-full max-w-md">
      <div class="grid grid-cols-3 gap-1">
        <a href="overview.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Overview</a>
        <a href="dataset.html" class="btn-nav px-2 sm:px-4 py-2 rounded-md text-center">Dataset</a>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 space-y-4 sm:space-y-6">

      <h2 class="title-section text-xl sm:text-2xl mb-4 sm:mb-6">Submit Predictions</h2>
      
      <form id="uploadForm" class="space-y-4 sm:space-y-6">

        </div>

    <!-- Table -->
    <section class="card p-4 sm:p-6 lg:p-8">
      <div class="flex justify-between items-center mb-4 sm:mb-6">
        <div class="flex items-center">
        <h2 class="title-section text-xl sm:text-2xl">Leaderboard</h2>
          <button id="refreshBtn" onclick="refreshLeaderboard()" class="ml-3 p-2 text-gray-600 hover:text-[var(--aau-blue)] hover:bg-gray-100 rounded-lg transition-colors" title="Refresh leaderboard">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>

        </div>

            🔄 Reset Scores
          </button>

      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[500px]" id="leaderboardTable">
          <thead>
            <tr class="table-header">
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Rank</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Team</th>
              <th class="px-3 sm:px-6 py-3 sm:py-4 text-left font-medium">Score</th>

  <script src="../assets/credential-hashes.js"></script>
  <script>
    // Team name mapping
    const teamNames = {
      'aau26_team1': 'P-value pirates',
      'aau26_team2': 'The Rvengers',
      'aau26_team3': 'Outliers',
      'aau26_team4': 'Smooth operators',
      'aau26_team5': 'Byte me'
    };
    
    // Get Supabase credentials from injected credentials
    // Fallback: use hardcoded values if not in credential-hashes.js (for testing)
    const supabaseUrl = (window.CREDENTIAL_HASHES?.supabase?.url || 'https://dprpzieckssfukfoghua.supabase.co').trim();
    const supabaseAnonKey = (window.CREDENTIAL_HASHES?.supabase?.anonKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwcnB6aWVja3NzZnVrZm9naHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4OTAxMTEsImV4cCI6MjA3OTQ2NjExMX0.I2-FzqmbN43047ao-PsHqBDimJ9eg_XB51grSUQ6KMY').trim();
    
    // Log for debugging
    console.log('Supabase config:', {
      url: supabaseUrl ? '✅ Configured' : '❌ Missing',
      key: supabaseAnonKey ? '✅ Configured' : '❌ Missing',
      fromCredentialHashes: !!window.CREDENTIAL_HASHES?.supabase
    });
    
    // Legacy GitHub credentials (kept for backward compatibility, but not used for RMSE)
    const githubToken = (window.CREDENTIAL_HASHES?.github?.token || '').trim();
    const githubRepo = (window.CREDENTIAL_HASHES?.github?.repo || 'lucagher/lucagher.github.io').trim();

    // Team emoji mapping (default emojis)
    const teamDefaultEmojis = {
      'aau26_team1': '🏴‍☠️',
      'aau26_team2': '🦸',
      'aau26_team3': '📊',
      'aau26_team4': '🎯',
      'aau26_team5': '💻'
    };

    // Initialize leaderboard data from localStorage or use default data
    function initializeLeaderboard() {
      const storedData = localStorage.getItem('leaderboardData');
      let data = [];
      
      if (storedData) {
        data = JSON.parse(storedData);
        // Update team names if they're outdated
        data.forEach(entry => {
          if (teamNames[entry.teamId]) {
            entry.team = teamNames[entry.teamId];
          }
        });
      } else {
      // Default empty leaderboard for the 5 teams
        data = [
          { teamId: 'aau26_team1', team: 'P-value pirates', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team2', team: 'The Rvengers', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team3', team: 'Outliers', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team4', team: 'Smooth operators', score: null, entries: 0, lastSubmission: 'No submissions yet' },
          { teamId: 'aau26_team5', team: 'Byte me', score: null, entries: 0, lastSubmission: 'No submissions yet' }
      ];
      }
      
      // Ensure all 5 teams are present
      const existingTeamIds = new Set(data.map(e => e.teamId));
      Object.keys(teamNames).forEach(teamId => {
        if (!existingTeamIds.has(teamId)) {
          data.push({
            teamId: teamId,
            team: teamNames[teamId],
            score: null,
            entries: 0,
            lastSubmission: 'No submissions yet'
          });
        }
      });
      
      return data;
    }
    
    let leaderboardData = initializeLeaderboard();

    // Function to sort data by score (ascending - lower is better)
    function sortLeaderboard(data) {
      return data.sort((a, b) => {
        // Teams without scores go to the bottom
        if (a.score === null && b.score === null) return 0;
        if (a.score === null) return 1;
        if (b.score === null) return -1;
        return a.score - b.score;
      });
    }

    // Function to format score
    function formatScore(score) {
      if (score === null) return '-';
      return score.toFixed(3);
    }
    
    // Function to check if GitHub Pages deployment is complete
    async function waitForDeployment(maxWaitSeconds = 120) {
      // GitHub Pages typically deploys within 1-2 minutes after a push
      // We'll check the file with increasing delays
      const startTime = Date.now();
      const maxWait = maxWaitSeconds * 1000;
      
      while (Date.now() - startTime < maxWait) {
        try {
          // Try to fetch the file with a unique cache buster
          const response = await fetch(`../assets/leaderboard-data.json?t=${Date.now()}&r=${Math.random()}`, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });
          
          if (response.ok) {
            // File is accessible, deployment might be complete
            return true;
          }
        } catch (e) {
          // File not accessible yet, continue waiting
        }
        
        // Wait 5 seconds before next check
        await new Promise(resolve => setTimeout(resolve, 5000));
      }
      
      return false;
    }
    
    // Function to load leaderboard data from Supabase
    async function loadLeaderboardData(forceRefresh = false) {
      try {
        if (!supabaseUrl || !supabaseAnonKey) {
          console.warn('Supabase not configured, using local data only');
          return;
        }
        
        const functionUrl = `${supabaseUrl}/functions/v1/get-leaderboard`;
        const cacheBuster = forceRefresh ? `?t=${Date.now()}&r=${Math.random()}` : `?t=${Date.now()}`;
        
        const response = await fetch(functionUrl + cacheBuster, {
          cache: 'no-store',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseAnonKey}`,
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          }
        });
        
        if (response.ok) {
          let serverData;
          try {
            const responseText = await response.text();
            console.log('Raw response from get-leaderboard:', responseText);
            serverData = JSON.parse(responseText);
            console.log('Parsed server data from Supabase:', serverData);
          } catch (e) {
            console.error('Error parsing response from get-leaderboard:', e);
            throw new Error('Invalid JSON response from server');
          }
          
          // Validate serverData is an object
          if (!serverData || typeof serverData !== 'object') {
            console.error('Invalid serverData format:', serverData);
            throw new Error('Invalid server data format');
          }
          
          // SERVER IS SOURCE OF TRUTH - completely overwrite local data for teams in server data
          // First, reset all teams that are NOT in server data (they have no submissions or were reset)
          leaderboardData.forEach(entry => {
            if (!serverData[entry.teamId]) {
              entry.score = null;
              entry.entries = 0;
              entry.lastSubmission = 'No submissions yet';
            }
          });
          
          // Then, update teams that ARE in server data
          Object.entries(serverData).forEach(([teamId, serverEntry]) => {
            let localEntry = leaderboardData.find(e => e.teamId === teamId);
            
            if (!localEntry) {
              // Create new entry if team doesn't exist locally
              localEntry = {
                teamId: teamId,
                team: teamNames[teamId] || 'Unknown Team',
                score: null,
                entries: 0,
                lastSubmission: 'No submissions yet'
              };
              leaderboardData.push(localEntry);
            }
            
            // COMPLETELY OVERWRITE with server data (server is source of truth)
            localEntry.score = serverEntry.score !== null && serverEntry.score !== undefined ? serverEntry.score : null;
            
            // Update entries - must be precise from server
            if (serverEntry.entries !== undefined && serverEntry.entries !== null) {
              localEntry.entries = parseInt(serverEntry.entries, 10); // Ensure it's an integer
            } else {
              localEntry.entries = 0;
            }
            
            // Update lastSubmission - show exact time
            if (serverEntry.lastSubmission) {
              try {
                // Parse ISO timestamp from server
                const date = new Date(serverEntry.lastSubmission);
                if (isNaN(date.getTime())) {
                  // Invalid date, use raw value
                  localEntry.lastSubmission = serverEntry.lastSubmission;
                } else {
                  // Format as exact date and time
                  const options = { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false // Use 24-hour format
                  };
                  // Format: DD/MM/YYYY HH:MM:SS
                  const formatted = date.toLocaleString('en-GB', options);
                  localEntry.lastSubmission = formatted;
                }
              } catch (e) {
                console.error(`Error formatting lastSubmission for ${teamId}:`, e);
                localEntry.lastSubmission = serverEntry.lastSubmission || 'No submissions yet';
              }
            } else {
              localEntry.lastSubmission = 'No submissions yet';
            }
            
            console.log(`✅ Updated ${teamId}: score=${localEntry.score}, entries=${localEntry.entries} (type: ${typeof localEntry.entries}), lastSubmission="${localEntry.lastSubmission}" (raw: ${serverEntry.lastSubmission})`);
            console.log(`   Server entry:`, serverEntry);
          });
          
          // Save merged data to localStorage
          saveLeaderboardData();
          console.log('✅ Leaderboard data after load:', leaderboardData);
          console.log('✅ Number of teams updated:', Object.keys(serverData).length);
          return true; // Indicate success
        } else {
          console.error('❌ Failed to load leaderboard data. Status:', response.status, response.statusText);
          const errorText = await response.text();
          console.error('Error response:', errorText);
          return false;
        }
      } catch (error) {
        console.error('❌ Error loading leaderboard data from Supabase:', error);
        console.error('Error details:', error.message, error.stack);
        // Continue with local data if server fetch fails
        return false;
      }
    }
    
    // Function to save leaderboard data to localStorage
    function saveLeaderboardData() {
      localStorage.setItem('leaderboardData', JSON.stringify(leaderboardData));
    }

    // Function to format last submission time
    function formatLastSubmission(time) {
      return time;
    }

    // Function to get team emoji
    function getTeamEmoji(teamId) {
      const emojis = JSON.parse(localStorage.getItem('teamEmojis') || '{}');
      return emojis[teamId] || teamDefaultEmojis[teamId] || '👤';
    }

    // Function to save team emoji
    function saveTeamEmoji(teamId, emoji) {
      const emojis = JSON.parse(localStorage.getItem('teamEmojis') || '{}');
      emojis[teamId] = emoji;
      localStorage.setItem('teamEmojis', JSON.stringify(emojis));
    }

    // Function to change team emoji
    function changeTeamEmoji() {
      const currentTeamId = sessionStorage.getItem('teamId');
      if (!currentTeamId) {
        alert('Please log in to change your team emoji!');
        return;
      }

      const currentEmoji = getTeamEmoji(currentTeamId);
      const newEmoji = prompt('Enter a new emoji for your team:', currentEmoji);
      
      if (newEmoji && newEmoji.trim()) {
        // Validate that it's mostly emoji characters
        const emojiRegex = /^[\p{Emoji}\p{Emoji_Presentation}\p{Emoji_Modifier_Base}\p{Emoji_Modifier}\p{Emoji_Component}]+$/u;
        if (emojiRegex.test(newEmoji.trim()) || newEmoji.length <= 3) {
          saveTeamEmoji(currentTeamId, newEmoji.trim());
          updateUserInfo();
          renderLeaderboard();
        } else {
          alert('Please enter a valid emoji!');
        }
      }
    }

    // Function to update user info display
    function updateUserInfo() {
      const currentTeamId = sessionStorage.getItem('teamId');
      const currentTeamName = sessionStorage.getItem('teamName');
      const userInfo = document.getElementById('userInfo');
      const userName = document.getElementById('userName');
      const userEmoji = document.getElementById('userEmoji');

      if (currentTeamId && currentTeamName) {
        userInfo.style.display = 'flex';
        userName.textContent = currentTeamName;
        userEmoji.textContent = getTeamEmoji(currentTeamId);
      } else {
        userInfo.style.display = 'none';
      }
    }

    // Function to render leaderboard
    function renderLeaderboard() {
      console.log('Rendering leaderboard with data:', leaderboardData);
      const sortedData = sortLeaderboard([...leaderboardData]);
      console.log('Sorted data:', sortedData);
      const tbody = document.getElementById('leaderboardBody');
      const currentTeamId = sessionStorage.getItem('teamId');
      
      if (!tbody) {
        console.error('❌ Leaderboard tbody element not found!');
        return;
      }
      
      tbody.innerHTML = sortedData.map((entry, index) => {
        const isCurrentTeam = entry.teamId === currentTeamId;
        const rowClass = isCurrentTeam ? 'table-row bg-blue-50 font-semibold' : 'table-row';
        const teamCellClass = isCurrentTeam ? 'px-3 sm:px-6 py-3 sm:py-4 font-medium text-[var(--aau-blue)]' : 'px-3 sm:px-6 py-3 sm:py-4 font-medium';
        
        const teamEmoji = getTeamEmoji(entry.teamId);
        
        return `
          <tr class="${rowClass}" data-team-id="${entry.teamId}">
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-base sm:text-lg font-semibold text-[var(--aau-blue)]">${index + 1}</td>
            <td class="${teamCellClass}">
              <div class="flex items-center">
                <span class="text-xl mr-2">${teamEmoji}</span>
                <span>${entry.team}${isCurrentTeam ? ' <span class="text-xs">(You)</span>' : ''}</span>
              </div>
            </td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono font-semibold ${entry.score !== null ? 'text-green-600' : 'text-gray-400'}">${formatScore(entry.score)}</td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 font-mono text-sm">${entry.entries}</td>
            <td class="px-3 sm:px-6 py-3 sm:py-4 text-sm text-gray-600">${formatLastSubmission(entry.lastSubmission)}</td>
          </tr>
        `;
      }).join('');
    }

    // Function to calculate RMSE
    function calculateRMSE(actual, predictions) {
      if (actual.length !== predictions.length) {
        throw new Error('Actual and prediction arrays must have the same length');
      }
      
      let sumSquaredErrors = 0;
      for (let i = 0; i < actual.length; i++) {
        const error = actual[i] - predictions[i];
        sumSquaredErrors += error * error;
      }
      
      const meanSquaredError = sumSquaredErrors / actual.length;
      return Math.sqrt(meanSquaredError);
    }

    // Function to parse CSV content
    function parseCSV(csvContent) {
      const lines = csvContent.trim().split('\n');
      const values = [];
      
      console.log('=== CSV PARSING ===');
      console.log('Total lines in CSV:', lines.length);
      console.log('Lines:', lines);
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line) {
          // Skip header row if it contains non-numeric text
          const firstColumn = line.split(',')[0].trim();
          const isHeader = i === 0 && (
            firstColumn.toLowerCase().includes('prediction') || 
            firstColumn.toLowerCase().includes('actual') || 
            isNaN(parseFloat(firstColumn))
          );
          
          if (isHeader) {
            console.log(`Skipping header row ${i + 1}: "${firstColumn}"`);
            continue; // Skip header row
          }
          
          // Handle CSV with or without headers - get first column value
          const value = parseFloat(firstColumn);
          
          if (!isNaN(value)) {
            values.push(value);
            console.log(`Line ${i + 1}: Parsed value = ${value}`);
          } else {
            console.warn(`Skipping non-numeric value in CSV line ${i + 1}: "${firstColumn}"`);
          }
        }
      }
      
      console.log(`=== PARSING COMPLETE ===`);
      console.log(`Total values parsed: ${values.length}`);
      console.log(`Values:`, values);
      return values;
    }

    // Function to submit predictions to Supabase and calculate RMSE
    async function submitPredictionsToSupabase(teamId, predictions) {
      if (!supabaseUrl || !supabaseAnonKey) {
        const isAdmin = sessionStorage.getItem('isAdmin') === 'true';
        if (isAdmin) {
          const errorMsg = '❌ Supabase non configurato!\n\n' +
            'Per risolvere:\n' +
            '1. Vai su GitHub → Settings → Secrets and variables → Actions\n' +
            '2. Aggiungi SUPABASE_URL e SUPABASE_ANON_KEY\n' +
            '3. Vai su Actions → Deploy GitHub Pages → Run workflow\n\n' +
            'Vedi SUPABASE-CREDENTIALS.txt per i valori.';
          throw new Error(errorMsg);
        } else {
          throw new Error('System configuration error. Please contact the administrator.');
        }
      }
      
      console.log('Submitting to Supabase:', {
        url: supabaseUrl,
        function: 'calculate-rmse',
        teamId: teamId,
        predictionsCount: predictions.length
      });
      
      const functionUrl = `${supabaseUrl}/functions/v1/calculate-rmse`;
      
      const response = await fetch(functionUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${supabaseAnonKey}`,
        },
        body: JSON.stringify({
          team_id: teamId,
          predictions: predictions
        })
      });
      
      if (!response.ok) {
        const errorText = await response.text();
        let errorMessage = `Failed to submit predictions: ${response.status}`;
        
        try {
          const errorJson = JSON.parse(errorText);
          if (errorJson.error) {
            errorMessage = errorJson.error;
          }
        } catch (e) {
          errorMessage += `\n${errorText}`;
        }
        
        throw new Error(errorMessage);
      }
      
      let result;
      try {
        const responseText = await response.text();
        console.log('Supabase raw response:', responseText);
        result = JSON.parse(responseText);
      } catch (e) {
        console.error('Error parsing response:', e);
        throw new Error('Invalid JSON response from server');
      }
      
      console.log('Supabase parsed response:', result);
      
      // Validate response structure
      if (!result || typeof result !== 'object') {
        throw new Error('Invalid response from Supabase: response is not an object');
      }
      
      if (result.success === false || (result.error && !result.success)) {
        throw new Error(result.error || 'Failed to calculate RMSE');
      }
      
      // Ensure success is true if not explicitly false
      if (result.success === undefined) {
        result.success = true;
      }
      
      return result;
    }

          console.log('File last modified:', new Date(currentFile.lastModified));
          console.log('CSV content (first 500 chars):', csvContent.substring(0, 500));
          console.log('CSV content (full):', csvContent);
          
          // Parse CSV - this will ALWAYS parse the current file content
          const predictions = parseCSV(csvContent);

            throw new Error('No valid predictions found in CSV file.');

          // Validate predictions are numbers

          if (invalidPredictions.length > 0) {
            throw new Error(`Invalid predictions found. All values must be numbers.`);

          // Debug: log predictions before sending

          console.log('Raw CSV content length:', csvContent.length);
          console.log('Parsed predictions array:', predictions);
          console.log('Predictions length:', predictions.length);
          console.log('Predictions as JSON string:', JSON.stringify(predictions));
          console.log('Predictions type check:', Array.isArray(predictions));
          console.log('Each prediction:', predictions.map((p, i) => `[${i}]=${p} (type: ${typeof p})`));
          
          // Validate predictions count (must match actual values count, which is 228)
          // Note: The actual values in the database have 228 entries

            throw new Error(`Expected exactly 228 predictions, but got ${predictions.length}. Please check your CSV file.`);

          // Show processing message

          statusDiv.className = 'fixed top-4 right-4 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
          statusDiv.innerHTML = `
            <div class="flex items-center">

              </svg>
              <span>Calculating RMSE...</span>
            </div>
          `;
          document.body.appendChild(statusDiv);
          console.log('✅ Status div added to page:', statusDiv);
          
          // Submit to Supabase and get immediate result (much faster than GitHub Actions!)
          console.log('Submitting predictions to Supabase...');

          try {

                  day: '2-digit',

                  second: '2-digit',
                  hour12: false
                };
                teamEntry.lastSubmission = date.toLocaleString('en-GB', options);
              }
              
          saveLeaderboardData();
              console.log('Updated local team entry:', teamEntry);
            }
            
            // IMPORTANT: Reload leaderboard data from Supabase to get the latest state
            // This ensures we have the most up-to-date data from the server

            // Highlight the current team's row temporarily
            setTimeout(() => {
              const currentTeamRow = document.querySelector(`tr[data-team-id="${currentTeamId}"]`);
              if (currentTeamRow) {
                currentTeamRow.classList.add('bg-green-100', 'animate-pulse');

                  setTimeout(() => {
                    currentTeamRow.classList.remove('bg-green-100');

            // Show success message with result
            statusDiv.className = 'fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            statusDiv.innerHTML = `
              <div class="flex items-center">
                <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <div>
                  <div class="font-bold">✅ Submission Successful!</div>
                  <div class="text-sm mt-1">RMSE: ${result.rmse.toFixed(4)} | Entries: ${result.entries} | ${teamEntry?.lastSubmission || 'Just now'}</div>
                </div>
              </div>
            `;
            setTimeout(() => {
              if (statusDiv.parentNode) {
                statusDiv.parentNode.removeChild(statusDiv);
              }
            }, 8000); // Show for 8 seconds so user can see the result
          } else {
            throw new Error('Failed to calculate RMSE');
          }
          
          // Reset form - IMPORTANT: clear the file input to allow re-uploading the same file
          // This ensures that even if the user selects the same file again, it will be re-read
          console.log('🔄 Resetting form...');
          fileInput.value = '';
          
          // Note: We don't need to clone/replace the input anymore since we're using FileReader
          // which always reads fresh content. Just clear the value.
          
          // Re-attach the form submit handler (in case it was removed)
          const form = document.getElementById('uploadForm');
          if (form) {
            // Remove old listener if exists and add new one
            form.removeEventListener('submit', handleFormSubmit);
            form.addEventListener('submit', handleFormSubmit);
            console.log('✅ Form submit handler re-attached');
          }
          
        } catch (error) {
          console.error('Submission error:', error);
          
          // Remove processing status if it was created
          if (statusDiv && statusDiv.parentNode) {
            statusDiv.parentNode.removeChild(statusDiv);
          }
          
          // Show error message
          const errorDiv = document.createElement('div');
          errorDiv.className = 'fixed top-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
          errorDiv.innerHTML = `
            <div class="flex items-center">
              <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
              <div>
                <div class="font-bold">❌ Error</div>
                <div class="text-sm mt-1">${error.message}</div>
              </div>
            </div>
          `;
          document.body.appendChild(errorDiv);
          setTimeout(() => {
            if (errorDiv.parentNode) {
              errorDiv.parentNode.removeChild(errorDiv);
            }
          }, 10000);
          
          alert('Error submitting predictions: ' + error.message);
        } finally {
          // Re-enable submit button
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
        }
      };
      
      reader.readAsText(file);

    // Function to reset leaderboard on Supabase (Admin only)
    // Uses REST API to call database function directly (more reliable than Edge Function)
    async function resetLeaderboardOnSupabase() {
      if (!supabaseUrl || !supabaseAnonKey) {
        throw new Error('Supabase not configured. Cannot reset leaderboard on server.');
      }
      
      // Use REST API to call database function directly
      const restUrl = `${supabaseUrl}/rest/v1/rpc/reset_leaderboard`;
      console.log('Resetting leaderboard via REST API:', restUrl);
      
      try {
        const response = await fetch(restUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseAnonKey}`,
            'apikey': supabaseAnonKey,
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({})
        });
        
        console.log('Reset response status:', response.status, response.statusText);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('Reset error response:', errorText);
          
          let errorMessage = `Failed to reset leaderboard: ${response.status} ${response.statusText}`;
          
          try {
            const errorJson = JSON.parse(errorText);
            if (errorJson.message) {
              errorMessage = errorJson.message;
            } else if (errorJson.error) {
              errorMessage = errorJson.error;
            }
          } catch (e) {
            errorMessage += `\n${errorText}`;
          }
          
          throw new Error(errorMessage);
        }
        
        const result = await response.json();
        console.log('Reset result:', result);
        
        // The function returns JSON, so result should be an array with one object
        if (Array.isArray(result) && result.length > 0) {
          return result[0];
        } else if (result && typeof result === 'object') {
          return result;
        } else {
          return { success: true, message: 'Leaderboard reset' };
        }
      } catch (error) {
        console.error('Error in resetLeaderboardOnSupabase:', error);
        throw error;
      }
    }

    // Function to reset leaderboard (Admin only)
    async function resetLeaderboard() {
      if (!confirm('Are you sure you want to reset the leaderboard? This will clear ALL submissions for ALL teams. This action cannot be undone.')) {
        return;
      }
      
      // Show loading state
      const resetButton = document.querySelector('button[onclick="resetLeaderboard()"]');
      const originalText = resetButton.textContent;
      resetButton.disabled = true;
      resetButton.textContent = 'Resetting...';
      
      try {
        console.log('Starting leaderboard reset...');
        
        // Reset on Supabase (server-side)
        console.log('Calling resetLeaderboardOnSupabase...');
        const resetResult = await resetLeaderboardOnSupabase();
        console.log('Reset result from Supabase:', resetResult);
        
        // Reset local storage
      localStorage.removeItem('leaderboardData');
      leaderboardData = initializeLeaderboard(); // Reloads default data
        
        // Reload data from Supabase to ensure sync (with force refresh)
        console.log('Reloading leaderboard data from Supabase...');
        await loadLeaderboardData(true);
        
        // Re-render leaderboard
        renderLeaderboard();
        
        console.log('After reset, leaderboard data:', leaderboardData);
        
        alert('✅ Leaderboard has been reset successfully! All submissions have been cleared for all teams.');
      } catch (error) {
        console.error('Error resetting leaderboard:', error);
        console.error('Error details:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        
        // Show detailed error message
        const errorMsg = `❌ Error resetting leaderboard on server:\n\n${error.message}\n\n` +
          `Local data has been reset, but server reset failed.\n\n` +
          `Please check:\n` +
          `1. Supabase Edge Function is deployed and active\n` +
          `2. Credentials are correct\n` +
          `3. Check browser console (F12) for more details`;

        // Still reset local data even if server reset fails
        localStorage.removeItem('leaderboardData');
        leaderboardData = initializeLeaderboard();
      saveLeaderboardData();
      renderLeaderboard();
      } finally {
        // Restore button state
        resetButton.disabled = false;
        resetButton.textContent = originalText;
      }
    }
