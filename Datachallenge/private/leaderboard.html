<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AAU Data Challenge</title>
  <!-- Google Fonts - Righteous -->
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
    }
    
    .bounce-title {
      font-family: 'Righteous', cursive;
      color: black;
      animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800">
  <!-- Logo and Title -->
  <div class="text-center py-8">
    <img src="../assets/logo2.png" alt="Universität Klagenfurt logo" class="h-16 mx-auto mb-4">
    <h1 class="bounce-title text-4xl">AAU Data Challenge</h1>
  </div>

  <!-- Navigation -->
  <nav class="text-center mb-8">
    <a href="overview.html" class="mx-4 px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400" style="font-family: 'Righteous', cursive;">Overview</a>
    <a href="dataset.html" class="mx-4 px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400" style="font-family: 'Righteous', cursive;">Dataset</a>
    <a href="leaderboard.html" class="mx-4 px-4 py-2 bg-[var(--aau-blue)] text-white rounded hover:bg-[var(--aau-light-blue)]" style="font-family: 'Righteous', cursive;">Leaderboard</a>
  </nav>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <section class="bg-white p-6 rounded shadow">
      <h2 class="text-2xl font-bold text-[var(--aau-blue)] mb-4" style="font-family: 'Righteous', cursive;">Leaderboard</h2>
      <!-- Upload form -->
      <form id="uploadForm" class="space-y-4">
        <input type="file" accept=".csv" class="border border-gray-300 rounded p-2 w-full" required>
        <button type="submit" class="bg-[var(--aau-blue)] text-white px-4 py-2 rounded hover:bg-[var(--aau-light-blue)]">Upload</button>
      </form>
    </section>

    <!-- Table -->
    <section class="bg-white p-6 rounded shadow">
      <table class="table-auto w-full border-collapse">
        <thead>
          <tr class="bg-[var(--aau-blue)] text-white">
            <th class="px-4 py-2 text-left">Rank</th>
            <th class="px-4 py-2 text-left">Team</th>
            <th class="px-4 py-2 text-left">Score</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-[var(--aau-gray)]">
            <td class="px-4 py-2">1</td>
            <td class="px-4 py-2">Team Alpha</td>
            <td class="px-4 py-2">0.123</td>
          </tr>
          <tr class="hover:bg-[var(--aau-gray)]">
            <td class="px-4 py-2">2</td>
            <td class="px-4 py-2">Data Ninjas</td>
            <td class="px-4 py-2">0.145</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
