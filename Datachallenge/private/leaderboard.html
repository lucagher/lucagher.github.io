<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AAU Data Challenge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Navigation bar -->
  <header class="bg-blue-800 text-white p-4">
    <div class="max-w-5xl mx-auto flex justify-between">
      <h1 class="text-xl font-bold">AAU Data Challenge</h1>
      <nav class="space-x-4">
        <a href="overview.html" class="hover:underline">Overview</a>
        <a href="dataset.html" class="hover:underline">Dataset</a>
        <a href="leaderboard.html" class="hover:underline font-bold">Leaderboard</a>
      </nav>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <!-- Upload section -->
    <section class="bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold text-blue-800 mb-4">Submit Your Prediction</h2>
      <form id="uploadForm" class="space-y-4">
        <input type="file" accept=".csv" class="border border-gray-300 rounded p-2 w-full" required>
        <button type="submit" class="bg-blue-800 text-white px-4 py-2 rounded hover:bg-blue-600">Upload</button>
      </form>
      <p id="uploadMessage" class="mt-4 text-green-600 hidden">File uploaded successfully!</p>
    </section>

    <!-- Leaderboard section -->
    <section class="bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold text-blue-800 mb-4">Leaderboard</h2>
      <table class="table-auto w-full border-collapse">
        <thead>
          <tr class="bg-blue-800 text-white">
            <th class="px-4 py-2 text-left">Rank</th>
            <th class="px-4 py-2 text-left">Team</th>
            <th class="px-4 py-2 text-left">Score</th>
          </tr>
        </thead>
        <tbody id="leaderboardTable">
          <tr class="hover:bg-gray-100">
            <td class="px-4 py-2">1</td>
            <td class="px-4 py-2">Team Alpha</td>
            <td class="px-4 py-2">0.123</td>
          </tr>
          <tr class="hover:bg-gray-100">
            <td class="px-4 py-2">2</td>
            <td class="px-4 py-2">Data Ninjas</td>
            <td class="px-4 py-2">0.145</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    // Simple mock upload handler
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('uploadMessage').classList.remove('hidden');
    });
  </script>
</body>
</html>
