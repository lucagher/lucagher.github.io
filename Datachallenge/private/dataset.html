<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataset - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .title-section {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--aau-blue);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    
    .download-link {
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .download-link:hover {
      transform: translateX(4px);
    }
  </style>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800">
  <!-- Logo and Title -->
  <div class="text-center py-12">
    <img src="../assets/logo2.png" alt="Universität Klagenfurt logo" class="h-20 mx-auto mb-6">
    <h1 class="title-main text-5xl mb-2">AAU Data Challenge</h1>
    <p class="text-gray-600 font-light">Competition Dashboard</p>
  </div>

  <!-- Navigation -->
  <nav class="flex justify-center mb-12">
    <div class="bg-gray-100 p-1 rounded-lg">
      <a href="overview.html" class="btn-nav px-6 py-2 rounded-md">Overview</a>
      <a href="dataset.html" class="btn-nav active px-6 py-2 rounded-md">Dataset</a>
      <a href="leaderboard.html" class="btn-nav px-6 py-2 rounded-md">Leaderboard</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-5xl mx-auto p-6">
    <section class="card p-8">
      <h2 class="title-section text-2xl mb-6">Datasets</h2>
      <p class="text-gray-600 mb-8">Download the data you need for the competition:</p>
      <div class="grid gap-4">
        <a href="../assets/train.csv" class="download-link flex items-center p-4 bg-gray-50 rounded-lg hover:bg-blue-50 group">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-blue-200">
            <span class="text-blue-600">📅</span>
          </div>
          <div>
            <h3 class="font-medium text-gray-900">Training Data</h3>
            <p class="text-sm text-gray-500">train.csv</p>
          </div>
        </a>
        <a href="../assets/test.csv" class="download-link flex items-center p-4 bg-gray-50 rounded-lg hover:bg-blue-50 group">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-blue-200">
            <span class="text-blue-600">📅</span>
          </div>
          <div>
            <h3 class="font-medium text-gray-900">Test Data</h3>
            <p class="text-sm text-gray-500">test.csv</p>
          </div>
        </a>
        <a href="../assets/rules.txt" class="download-link flex items-center p-4 bg-gray-50 rounded-lg hover:bg-blue-50 group">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-blue-200">
            <span class="text-blue-600">📔</span>
          </div>
          <div>
            <h3 class="font-medium text-gray-900">Challenge Rules</h3>
            <p class="text-sm text-gray-500">rules.txt</p>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
