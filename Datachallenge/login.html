<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .input-field {
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39, 108, 138, 0.15);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
  </style>
  <script>
    // Multiple competition password system
    const competitions = {
      'renewable': {
        password: 'AAU2025',
        redirect: 'private/overview.html',
        name: 'Renewable Energy Forecasting'
      },
      'medical': {
        password: 'MED2025',
        redirect: 'private/medical/overview.html',
        name: 'Medical Image Analysis'
      },
      'autonomous': {
        password: 'AUTO2025',
        redirect: 'private/autonomous/overview.html',
        name: 'Autonomous Vehicle Challenge'
      }
    };

    // Get competition from URL parameter
    function getCompetition() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('competition') || 'renewable';
    }

    // Update page based on competition
    function updateCompetitionInfo() {
      const competition = getCompetition();
      const compData = competitions[competition];
      
      if (compData) {
        document.getElementById('competition-name').textContent = compData.name;
        document.getElementById('competition-title').textContent = compData.name + ' - Login';
        document.title = 'Login - ' + compData.name;
      }
    }

    function checkPassword() {
      const password = document.getElementById('password').value;
      const competition = getCompetition();
      const compData = competitions[competition];
      
      if (compData && password === compData.password) {
        window.location.href = compData.redirect;
      } else {
        document.getElementById('error').textContent = "Incorrect password, try again.";
      }
    }

    // Update page when loaded
    window.onload = function() {
      updateCompetitionInfo();
    }
  </script>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800 min-h-screen">
  <!-- Logo and Title -->
  <div class="text-center py-12">
    <img src="assets/logo2.png" alt="Universität Klagenfurt logo" class="h-20 mx-auto mb-6">
    <h1 class="title-main text-5xl mb-2">AAU Data Challenge</h1>
    <p class="text-gray-600 font-light">Access Competition Dashboard</p>
  </div>

  <!-- Navigation -->
  <nav class="flex justify-center mb-12">
    <div class="bg-gray-100 p-1 rounded-lg">
      <a href="index.html" class="btn-nav px-6 py-2 rounded-md">Home</a>
      <a href="login.html" class="btn-nav active px-6 py-2 rounded-md">Login</a>
    </div>
  </nav>
  
  <!-- Login Form -->
  <div class="flex items-center justify-center min-h-[50vh]">
    <div class="card p-8 w-96">
      <div class="text-center mb-8">
        <h2 id="competition-title" class="title-main text-2xl mb-2">Competition Login</h2>
        <p class="text-gray-600">Enter access password for:</p>
        <p id="competition-name" class="text-blue-600 font-medium">Renewable Energy Forecasting</p>
      </div>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Access Password</label>
          <input type="password" id="password" placeholder="Enter access password"
                 class="input-field w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent">
        </div>
        
        <button onclick="checkPassword()" class="btn-primary text-white py-3 rounded-lg w-full">
          Access Dashboard
        </button>
        
        <p id="error" class="text-red-500 text-sm text-center"></p>
      </div>
    </div>
  </div>
</body>
</html>
