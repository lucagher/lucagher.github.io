<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .input-field {
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39, 108, 138, 0.15);
    }
    
    .btn-nav {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-nav.active {
      background: var(--aau-blue);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-nav:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }
    
    .btn-nav:not(.active):hover {
      background: #e2e8f0;
      color: var(--aau-blue);
    }
    
    .clean-background {
      background: #ffffff;
    }
    
    .title-modern {
      font-family: 'Poppins', sans-serif;
    }
    
    .title-gradient {
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      line-height: 1.4;
      padding: 0.5rem 0 0.8rem 0;
      margin-bottom: 0.5rem;
    }
    
    .subtitle-modern {
      color: #64748b;
      font-weight: 500;
      font-size: 1.25rem;
      margin-top: 0.5rem;
    }
  </style>
  <script>
    // Multiple competition password system
    const competitions = {
      'renewable': {
        password: 'AAU2025',
        redirect: 'private/overview.html',
        name: 'Renewable Energy Forecasting'
      },
      'medical': {
        password: 'MED2025',
        redirect: 'private/medical/overview.html',
        name: 'Medical Image Analysis'
      },
      'autonomous': {
        password: 'AUTO2025',
        redirect: 'private/autonomous/overview.html',
        name: 'Autonomous Vehicle Challenge'
      }
    };

    // Get competition from URL parameter
    function getCompetition() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('competition') || 'renewable';
    }

    // Update page based on competition
    function updateCompetitionInfo() {
      const competition = getCompetition();
      const compData = competitions[competition];
      
      if (compData) {
        document.getElementById('competition-name').textContent = compData.name;
        document.getElementById('competition-title').textContent = compData.name + ' - Login';
        document.title = 'Login - ' + compData.name;
      }
    }

    function checkPassword() {
      const password = document.getElementById('password').value;
      const competition = getCompetition();
      const compData = competitions[competition];
      
      if (compData && password === compData.password) {
        window.location.href = compData.redirect;
      } else {
        document.getElementById('error').textContent = "Incorrect password, try again.";
      }
    }

    // Update page when loaded
    window.onload = function() {
      updateCompetitionInfo();
    }
  </script>
</head>
<body class="clean-background min-h-screen">
  <!-- Header Section -->
  <div class="relative z-20">
    <!-- Modern Header -->
    <div class="max-w-7xl mx-auto px-6 py-12">
      <div class="flex flex-col lg:flex-row items-center lg:items-start justify-between">
        <!-- Modern Title Section -->
        <div class="title-modern text-center lg:text-left mb-8 lg:mb-0 flex-1" style="overflow: visible;">
          <h1 class="title-gradient text-5xl lg:text-7xl mb-6" style="overflow: visible;">
            AAU Data<br>Challenges
          </h1>
          <p class="subtitle-modern max-w-lg mx-auto lg:mx-0 text-lg lg:text-xl">
            Access your competition dashboard
          </p>
        </div>
        
        <!-- Logo -->
        <div class="flex-shrink-0 lg:ml-8">
          <img src="assets/logo2.png" alt="Universität Klagenfurt logo" class="h-20 lg:h-24 opacity-90">
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="text-center mb-12">
      <nav class="inline-block">
        <a href="index.html" class="inline-flex items-center px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 hover:text-[var(--aau-blue)] rounded-lg transition-all duration-300 font-medium" style="font-family: 'Poppins', sans-serif;">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Back to Home
        </a>
      </nav>
    </div>
  </div>
  
  <!-- Login Form -->
  <main class="relative z-20 max-w-7xl mx-auto px-6 pb-12">
    <div class="flex justify-center">
      <div class="card p-8 w-full max-w-md">
        <div class="text-center mb-8">
          <!-- University seal in login form -->
          <img src="assets/logoKL.png" alt="Universität Klagenfurt seal" class="mx-auto mb-6 h-16">
          <h2 id="competition-title" class="text-2xl font-bold mb-3" style="font-family: 'Poppins', sans-serif; color: var(--aau-blue);">Competition Login</h2>
          <p class="text-gray-600 mb-2" style="font-family: 'Poppins', sans-serif;">Enter access password for:</p>
          <p id="competition-name" class="text-blue-600 font-semibold" style="font-family: 'Poppins', sans-serif;">Renewable Energy Forecasting</p>
        </div>
        
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2" style="font-family: 'Poppins', sans-serif;">Access Password</label>
            <input type="password" id="password" placeholder="Enter access password"
                   class="input-field w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent"
                   style="font-family: 'Poppins', sans-serif;">
          </div>
          
          <button onclick="checkPassword()" class="bg-[var(--aau-light-blue)] hover:bg-[var(--aau-blue)] text-white py-3 rounded-lg w-full font-semibold transition-all duration-300 transform hover:scale-105"
                  style="font-family: 'Poppins', sans-serif;">
            Access Dashboard →
          </button>
          
          <p id="error" class="text-red-500 text-sm text-center" style="font-family: 'Poppins', sans-serif;"></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
