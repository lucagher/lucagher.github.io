<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AAU Data Challenge</title>
  <!-- Google Fonts - Righteous -->
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* primary dark blue */
      --aau-blue: #276C8A;
      /* secondary light blue */
      --aau-light-blue: #6699CC;
      /* neutral background */
      --aau-gray: #F5F7FA;
    }
    
    .bounce-title {
      font-family: 'Righteous', cursive;
      color: black;
      animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }
  </style>
  <script>
    // Simple password check for demonstration purposes. Note: the password will be visible in the source.
    function checkPassword() {
      const password = document.getElementById('password').value;
      const correct = "AAU2025"; // Set your access password here
      if (password === correct) {
        window.location.href = "private/overview.html";
      } else {
        document.getElementById('error').textContent = "Incorrect password, try again.";
      }
    }
  </script>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800 min-h-screen">
  <!-- Logo and Title -->
  <div class="text-center py-8">
    <img src="assets/logo2.png" alt="Universität Klagenfurt logo" class="h-16 mx-auto mb-4">
    <h1 class="bounce-title text-4xl">AAU Data Challenge</h1>
  </div>
  
  <!-- Login Form -->
  <div class="flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow-md w-80">
      <h2 class="text-xl font-bold mb-4 text-center text-[var(--aau-blue)]" style="font-family: 'Righteous', cursive;">Login</h2>
    <input type="password" id="password" placeholder="Enter access password"
           class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring focus:ring-[var(--aau-light-blue)]">
    <button onclick="checkPassword()"
            class="w-full bg-[var(--aau-blue)] text-white py-2 rounded hover:bg-[var(--aau-light-blue)]">Enter</button>
      <p id="error" class="mt-4 text-red-500 text-sm text-center"></p>
    </div>
  </div>
</body>
</html>
