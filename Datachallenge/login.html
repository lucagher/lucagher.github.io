<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AAU Data Challenge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Simple password check for demonstration purposes. Note: the password will be visible in the source.
    function checkPassword() {
      const password = document.getElementById('password').value;
      const correct = "AAU2025"; // Set your access password here
      if (password === correct) {
        window.location.href = "private/overview.html";
      } else {
        document.getElementById('error').textContent = "Incorrect password, try again.";
      }
    }
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-80">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-800">AAU Data Challenge</h2>
    <input type="password" id="password" placeholder="Enter access password"
           class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring focus:ring-blue-200">
    <button onclick="checkPassword()"
            class="w-full bg-blue-800 text-white py-2 rounded hover:bg-blue-600">Enter</button>
    <p id="error" class="mt-4 text-red-500 text-sm text-center"></p>
  </div>
</body>
</html>
