<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AAU Data Challenge</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
      --dark-gray: #1f2937;
      --light-gray: #f8fafc;
    }
    
    .title-main {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: var(--dark-gray);
      letter-spacing: -0.025em;
    }
    
    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: linear-gradient(135deg, var(--aau-blue) 0%, var(--aau-light-blue) 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .input-field {
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39, 108, 138, 0.15);
    }
  </style>
  <script>
    // Simple password check for demonstration purposes. Note: the password will be visible in the source.
    function checkPassword() {
      const password = document.getElementById('password').value;
      const correct = "AAU2025"; // Set your access password here
      if (password === correct) {
        window.location.href = "private/overview.html";
      } else {
        document.getElementById('error').textContent = "Incorrect password, try again.";
      }
    }
  </script>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800 min-h-screen">
  <!-- Logo and Title -->
  <div class="text-center py-12">
    <img src="assets/logo2.png" alt="Universität Klagenfurt logo" class="h-20 mx-auto mb-6">
    <h1 class="title-main text-5xl mb-2">AAU Data Challenge</h1>
    <p class="text-gray-600 font-light">Access Competition Dashboard</p>
  </div>
  
  <!-- Login Form -->
  <div class="flex items-center justify-center min-h-[50vh]">
    <div class="card p-8 w-96">
      <div class="text-center mb-8">
        <h2 class="title-main text-2xl mb-2">Welcome Back</h2>
        <p class="text-gray-600">Enter your access credentials</p>
      </div>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Access Password</label>
          <input type="password" id="password" placeholder="Enter access password"
                 class="input-field w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--aau-blue)] focus:border-transparent">
        </div>
        
        <button onclick="checkPassword()" class="btn-primary text-white py-3 rounded-lg w-full">
          Access Dashboard
        </button>
        
        <p id="error" class="text-red-500 text-sm text-center"></p>
      </div>
    </div>
  </div>
</body>
</html>
