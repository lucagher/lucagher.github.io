<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAU Data Challenge</title>
  <!-- Google Fonts - Righteous -->
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --aau-blue: #276C8A;
      --aau-light-blue: #6699CC;
      --aau-gray: #F5F7FA;
    }
    
    .bounce-title {
      font-family: 'Righteous', cursive;
      color: black;
      animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>
<body class="bg-[var(--aau-gray)] text-gray-800">
  <!-- Logo and Title -->
  <div class="text-center py-8">
    <img src="assets/logo2.png" alt="Universität Klagenfurt logo" class="h-16 mx-auto mb-4">
    <h1 class="bounce-title text-4xl">AAU Data Challenges</h1>
  </div>

  <!-- Main content -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    <h2 class="text-xl font-semibold mb-6 text-[var(--aau-blue)]" style="font-family: 'Righteous', cursive;">Current Challenge</h2>

    <div class="bg-white rounded-lg shadow hover:shadow-lg transition p-6 border-t-4 border-[var(--aau-light-blue)] max-w-md">
      <h3 class="text-lg font-bold mb-2 text-[var(--aau-blue)]">Renewable Energy Forecasting</h3>
      <p class="text-sm text-gray-600 mb-4">
        Build a machine learning model to forecast renewable energy demand using real-world data.
      </p>
      <div class="text-sm text-gray-500 mb-4">
        <p><strong>Deadline:</strong> 30 April 2025</p>
        <p><strong>Prize:</strong> €500</p>
      </div>
      <a href="login.html"
         class="block text-center bg-[var(--aau-blue)] text-white rounded px-4 py-2 hover:bg-[var(--aau-light-blue)]">
        Enter Competition
      </a>
    </div>
  </main>
</body>
</html>
